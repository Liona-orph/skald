# Scan reachable dependency vulnerabilities before they merge.
#
# GitHub's dependency-review action is unavailable to private repositories
# without GitHub Advanced Security. govulncheck is supported everywhere and
# examines the package call graph, so it catches vulnerabilities exercised by
# this code whether they were introduced by this pull request or predate it.

name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.25.12"
          cache: true

      # Pin the scanner for reproducible CI while its advisory database stays
      # current on every invocation.
      - name: Scan reachable dependency vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
