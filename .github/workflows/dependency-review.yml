# Review dependency changes before they merge.
#
# The check is on the diff, not on the tree: it compares the base and head
# commits' dependency graphs and reports what the pull request adds. A known
# vulnerability that arrives with a new dependency fails here rather than in a
# scan somebody reads next quarter.

name: Dependency review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Review
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # Post the summary as a comment on the pull request.
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/dependency-review-action@3b139cfc5fae8b618d3eae3675e383bb1769c019 # v4.5.0
        with:
          # Moderate rather than high. Skald has fourteen direct dependencies
          # and a deliberately small graph; the noise a lower threshold would
          # cause elsewhere does not exist here.
          fail-on-severity: moderate
          comment-summary-in-pr: on-failure
          # The project is Apache-2.0. A copyleft dependency would relicense
          # everything downstream of it, which is a decision for a maintainer
          # and an ADR, not for a dependency bump.
          deny-licenses: >-
            AGPL-1.0-only, AGPL-1.0-or-later, AGPL-3.0-only, AGPL-3.0-or-later,
            GPL-2.0-only, GPL-2.0-or-later, GPL-3.0-only, GPL-3.0-or-later,
            SSPL-1.0
