# Cut a release from a signed tag.
#
#   git tag -s v1.2.3 -m 'v1.2.3' && git push origin v1.2.3
#
# Everything the release publishes is built here, from the tagged commit, by a
# job whose permissions are written down below. Nothing is uploaded from a
# laptop.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build every artefact and publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Never two releases at once, and never cancel one halfway: a cancelled
  # release leaves half the artefacts on the release page.
  group: release
  cancel-in-progress: false

jobs:
  # The tag is not trusted until the tests pass on the exact commit it names.
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true

      - name: Test with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Simulation sweep
        run: |
          go test ./internal/simulation -run TestSimulation -count=1 \
            -timeout 30m -skald.seeds=2000

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: verify
    permissions:
      # Create the release and upload its artefacts.
      contents: write
      # Push the image to ghcr.io.
      packages: write
      # Mint the OIDC token cosign uses for keyless signing.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser builds the changelog from the commit range since the
          # previous tag, which it cannot see in a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.25.12"
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # syft generates the SBOM referenced by the `sboms` block in
      # .goreleaser.yml. GoReleaser shells out to it.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release --clean
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--snapshot --skip=publish,announce' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keyless signing: the signature is bound to this workflow's identity in
      # the public transparency log, so "who built this" is answerable without
      # anyone holding a private key.
      - name: Sign the checksum file
        if: github.event_name == 'push'
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt
          gh release upload "${GITHUB_REF_NAME}" \
            dist/checksums.txt.sig dist/checksums.txt.pem --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
