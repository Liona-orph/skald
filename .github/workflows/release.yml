# Cut a release from a signed tag.
#
#   git tag -s v1.2.3 -m 'v1.2.3' && git push origin v1.2.3
#
# Everything the release publishes is built here, from the tagged commit, by a
# job whose permissions are written down below. Nothing is uploaded from a
# laptop.

name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build every artefact and publish nothing"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  # Never two releases at once, and never cancel one halfway: a cancelled
  # release leaves half the artefacts on the release page.
  group: release
  cancel-in-progress: false

jobs:
  # The tag is not trusted until the tests pass on the exact commit it names.
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.25.12"
          cache: true

      - name: Test with the race detector
        env:
          CGO_ENABLED: "1"
        run: go test -race ./...

      - name: Simulation sweep
        run: |
          go test ./internal/simulation -run TestSimulation -count=1 \
            -timeout 30m -skald.seeds=2000

  release:
    name: Release
    runs-on: ubuntu-24.04
    needs: verify
    permissions:
      # Create the release and upload its artefacts.
      contents: write
      # Push the image to ghcr.io.
      packages: write
      # Mint the OIDC token cosign uses for keyless signing.
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # GoReleaser builds the changelog from the commit range since the
          # previous tag, which it cannot see in a shallow clone.
          fetch-depth: 0

      - uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
        with:
          go-version: "1.25.12"
          cache: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@49b3bc8e6bdd4a60e6116a5414239cba5943d3cf # v3.2.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1

      - name: Log in to ghcr.io
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # syft generates the SBOM referenced by the `sboms` block in
      # .goreleaser.yml. GoReleaser shells out to it.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@df80a981bc6edbc4e220a492d3cbe9f5547a6e75 # v0.17.9

      - name: Install cosign
        uses: sigstore/cosign-installer@dc72c7d5c4d10cd6bcb8cf6e3fd625a9e5e537da # v3.7.0

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@286f3b13b1b49da4ac219696163fb8c1c93e1200 # v6.0.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: >-
            release --clean
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--snapshot --skip=publish,announce' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Keyless signing: the signature is bound to this workflow's identity in
      # the public transparency log, so "who built this" is answerable without
      # anyone holding a private key.
      - name: Sign the checksum file
        if: github.event_name == 'push'
        run: |
          cosign sign-blob --yes \
            --output-signature dist/checksums.txt.sig \
            --output-certificate dist/checksums.txt.pem \
            dist/checksums.txt
          gh release upload "${GITHUB_REF_NAME}" \
            dist/checksums.txt.sig dist/checksums.txt.pem --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
