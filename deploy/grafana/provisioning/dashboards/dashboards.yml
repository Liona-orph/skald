# Dashboard provisioning.
#
# The dashboards directory is mounted read-only, and allowUiUpdates is false, so
# an edit made in the browser cannot be saved. That is deliberate: the dashboard
# is a file in this repository and a change to it goes through review like any
# other. Use "Save as" to experiment.

apiVersion: 1

providers:
  - name: skald
    orgId: 1
    folder: Skald
    type: file
    disableDeletion: false
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
